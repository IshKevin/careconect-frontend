# Web app on its own. Start the API separately (careconect-bn) or use the combined stack at the workspace root.
#   docker compose up --build        -> http://localhost:3001
# NEXT_PUBLIC_API_BASE_URL is compiled into the bundle, so change it and rebuild when the API address changes.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1}
    environment:
      HOSTNAME: "0.0.0.0"
    ports:
      - "${WEB_PORT:-3001}:3000"
    restart: unless-stopped
